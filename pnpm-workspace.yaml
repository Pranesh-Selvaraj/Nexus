packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  bcrypt: true
  '@tailwindcss/oxide': true
  msgpackr-extract: true
  langchain: true

minimumReleaseAgeExclude:
  - langsmith@0.8.10

overrides:
  '@langchain/core': 0.3.80
  langsmith: 0.8.10
  uuid: 11.1.1
  esbuild: 0.25.0
  js-yaml: 4.3.2 # GHSA-2883-xcg3-v3hh (langchain)
  qs: '>=6.16.0' # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (express/body-parser)
  brace-expansion: '>=5.0.12' # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr (minimatch/eslint)
  proxy-addr: '>=2.0.8' # GHSA-jqcg-44mw-7w3h (express)
  shell-quote: '>=1.12.0' # GHSA-pqg4-j6r4-53mv (concurrently, dev)
  source-map-js: '>=1.2.2' # GHSA-68fv-2mgg-jv7q (vite/tailwind, dev)
  katex: '>=0.18.2' # GHSA-238p-pmpm-9mq7 (rehype-katex)
  argparse: '^2.0.1' # removes sprintf-js (GHSA-hp3w-g68c-fv3c); mammoth's CLI-only dep is unused
