# Production stack: frontend (nginx) + API + worker + Postgres + Redis.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# Secrets are read from the repo-root .env file (see .env.example).
# The UI is served at http://localhost:8080.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - nexus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nexus-uploads:/app/apps/backend/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ['node', 'dist/apps/backend/src/workers/embedding.worker.js']
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nexus-uploads:/app/apps/backend/uploads
    # The image bakes in the HTTP /healthz check (backend-only); the worker
    # serves no HTTP, so probe process liveness instead.
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nexus-pgdata:
  nexus-uploads:
