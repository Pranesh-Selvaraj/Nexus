<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexus — turn anything you read, watch or photograph into grounded, practiceable knowledge. Self-hosted, with cited answers, spaced repetition and offline review."
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus — grounded learning workspace" />
    <meta
      property="og:description"
      content="Turn anything you read, watch or photograph into grounded, practiceable knowledge. Self-hosted, with cited answers, spaced repetition and offline review."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ?v is bumped whenever the brand assets change: browsers cache favicons
         aggressively and would otherwise keep showing the previous mark. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=3" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png?v=3"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <title>Nexus — grounded learning workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
